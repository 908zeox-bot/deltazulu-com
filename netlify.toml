[build]
  publish = "dist"

[[redirects]]
  from = "/dashboard"
  to   = "https://100.104.213.86/"
  status = 302
  force  = true

[[redirects]]
  from = "https://www.deltazulu.com/dashboard"
  to   = "https://100.104.213.86/"
  status = 302
  force  = true

[[redirects]]
  from = "/wine/michel-schlumberger"
  to = "/#portfolio"
  status = 301

[[redirects]]
  from = "/aviation/platte-valley-airpark"
  to = "/#portfolio"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
